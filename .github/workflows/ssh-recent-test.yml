name: SSH recent channel validation

on:
  push:
    branches: [test/ssh-recent-channel-validation]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
          pub-cache: true
      - id: iroh
        uses: ./.github/actions/bao-iroh-prebuilt
      - if: steps.iroh.outputs.hit != 'true'
        uses: ./.github/actions/setup-rust
      - run: flutter pub get
      - name: Check changed Dart formatting
        run: dart format --output=none --set-exit-if-changed lib/platform/open_requests.dart test/platform/open_requests_test.dart
      - name: Analyze changed Dart files
        run: dart analyze --fatal-infos lib/platform/open_requests.dart test/platform/open_requests_test.dart
      - name: Verify regression fails without the fix
        shell: bash
        run: |
          set -euo pipefail
          git show e92b7cfb:lib/platform/open_requests.dart > lib/platform/open_requests.dart
          trap 'git restore --source=HEAD -- lib/platform/open_requests.dart' EXIT
          set +e
          flutter test test/platform/open_requests_test.dart --plain-name 'delivers SSH recent locations kept at launch and sent live' --reporter expanded > "$RUNNER_TEMP/ssh-before.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/ssh-before.log"
          if [ "$result" -eq 0 ]; then
            echo '::error::The regression unexpectedly passed without the fix'
            exit 1
          fi
          grep -F 'Expected:' "$RUNNER_TEMP/ssh-before.log"
          grep -F 'Actual: []' "$RUNNER_TEMP/ssh-before.log"
      - name: Verify regression passes with the fix
        run: flutter test test/platform/open_requests_test.dart --plain-name 'delivers SSH recent locations kept at launch and sent live' --reporter expanded
      - name: Run related platform and window tests
        run: flutter test test/platform/open_requests_test.dart test/window/app_windows_test.dart --reporter expanded
